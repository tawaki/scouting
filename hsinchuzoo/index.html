<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新竹動物園 動物小百科</title>
<link rel="icon" href="logo.png">
<meta name="description" content="新竹市立動物園各展區動物介紹：我是誰、我家在哪裡、生態功能、經濟功能、我的獨特超能力、我的特殊需求。">
<style>
:root{
  --bg:#f6f4ec; --card:#ffffff; --ink:#24302a; --muted:#5f6b63; --line:#dcd8c8;
  --accent:#2f7d4f; --chip:#e8efe6;
  --a1:#8a6d1e; --a2:#c2571a; --a3:#2e7d6b; --a4:#a3332d; --a5:#2a6aa8; --a6:#7a4fa3;
  --sec:#f3f6f1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a17; --card:#1f2622; --ink:#e7ece8; --muted:#a8b3ac; --line:#34403a;
    --accent:#6cc191; --chip:#26302b;
    --a1:#e0bd5c; --a2:#f08d52; --a3:#5fc7ae; --a4:#ef7a72; --a5:#7db5ec; --a6:#bd98e3;
    --sec:#252d29;
  }
}
:root[data-theme="dark"]{
  --bg:#151a17; --card:#1f2622; --ink:#e7ece8; --muted:#a8b3ac; --line:#34403a;
  --accent:#6cc191; --chip:#26302b;
  --a1:#e0bd5c; --a2:#f08d52; --a3:#5fc7ae; --a4:#ef7a72; --a5:#7db5ec; --a6:#bd98e3;
  --sec:#252d29;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  line-height:1.7;font-size:17px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header{padding:22px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{height:76px;width:auto;flex:none}
h1{font-size:1.6rem;margin:0;line-height:1.3}
.sub{color:var(--muted);margin:6px 0 0;font-size:.95rem}
#theme{align-self:flex-start;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:6px 12px;font-size:.9rem;cursor:pointer;flex:none}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--chip);color:var(--ink);
  text-decoration:none;font-size:.92rem;border:1px solid var(--line)}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;
  padding:4px 10px;font-size:.85rem;cursor:pointer}
section.area{margin:26px 0 8px;scroll-margin-top:110px}
.area h2{font-size:1.3rem;margin:0 0 4px;padding-left:10px;border-left:6px solid var(--c)}
.area .note{color:var(--muted);font-size:.9rem;margin:0 0 10px 16px}
details.animal{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);
  border-radius:12px;margin:10px 0;overflow:hidden}
details.animal>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px}
details.animal>summary::-webkit-details-marker{display:none}
.emo{flex:none;width:3.2rem;height:3.2rem;display:block;object-fit:contain}
.nm{flex:1;min-width:0}
.nm b{font-size:1.15rem}
.nm .tag{display:block;color:var(--muted);font-size:.88rem}
.arrow{flex:none;color:var(--muted);transition:transform .2s}
details[open] .arrow{transform:rotate(90deg)}
.body{padding:0 14px 14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.meta span{font-size:.8rem;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--muted)}
.meta .plink{margin-left:auto;font-size:.82rem;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:1px 10px;white-space:nowrap}
.q{background:var(--sec);border-radius:10px;padding:10px 12px;margin:8px 0}
.q h3{margin:0 0 2px;font-size:1rem;color:var(--c)}
.q p{margin:0}
footer{color:var(--muted);font-size:.85rem;padding:28px 0 40px;border-top:1px solid var(--line);margin-top:30px}
footer a{color:var(--accent)}
@media (max-width:480px){ body{font-size:16px} h1{font-size:1.35rem} .logo{height:60px} .brand{gap:10px} .emo{width:2.8rem;height:2.8rem} }
.kicker{display:block;font-size:.8rem;letter-spacing:.04em;color:var(--muted);text-decoration:none;margin-bottom:2px}
.kicker:hover{text-decoration:underline}
</style>
</head>
<body>
<header class="wrap">
  <div class="top">
    <div class="brand"><a href="../" title="回童軍教學資源首頁"><img class="logo" src="logo.png" alt="童軍教學資源首頁" width="228" height="300"></a><div><a class="kicker" href="../">Scouting · Exploring the world</a><h1>新竹動物園 動物小百科</h1></div></div>
    <button id="theme" type="button" aria-label="切換深色或淺色">🌓 深淺色</button>
  </div>
  <p class="sub">點動物的名字，看看牠的自我介紹。</p>
</header>
<nav class="wrap" aria-label="展區">
  <div class="chips" id="chips"></div>
  <div class="tools">
    <button type="button" id="openAll">全部展開</button>
    <button type="button" id="closeAll">全部收合</button>
  </div>
</nav>
<main class="wrap" id="main"></main>
<footer class="wrap">
  <p>動物名單與介紹參考<a href="https://zoo-info.hccg.gov.tw/park/animals/" target="_blank" rel="noopener">新竹市立動物園官網「動物資訊」</a>；紅鶴、鵝鴨、狐獴依 2026 年 7 月新聞報導，官網尚未介紹。</p>
  <p>園方公告約有 38 種動物，這裡列的是有公開介紹的種類。動物偶爾會移出或過世，出發前可以先到官網確認。</p>
</footer>
<script src="animals.js"></script>
<script>
const main = document.getElementById("main"), chips = document.getElementById("chips");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
for (const a of AREAS) {
  chips.insertAdjacentHTML("beforeend", `<a href="#${a.id}" style="border-color:var(${a.c})">${a.name}</a>`);
  const cards = a.animals.map(x => `
    <details class="animal">
      <summary><img class="emo" src="art/${x.id}.svg" alt="" width="64" height="64" loading="lazy">
        <span class="nm"><b>${esc(x.n)}</b><span class="tag">${esc(x.t)}</span></span>
        <span class="arrow" aria-hidden="true">▶</span></summary>
      <div class="body">
        <div class="meta">${x.m.map(t => `<span>${esc(t)}</span>`).join("")}<a class="plink" href="poster.html#${x.id}">🖍️ 海報製作參考</a></div>
        ${x.q.map((p, i) => `<div class="q"><h3>${i + 1}. ${Q[i][0]} ${Q[i][1]}</h3><p>${esc(p)}</p></div>`).join("")}
      </div>
    </details>`).join("");
  main.insertAdjacentHTML("beforeend",
    `<section class="area" id="${a.id}" style="--c:var(${a.c})"><h2>${a.name}（${a.animals.length}）</h2>${a.note ? `<p class="note">${a.note}</p>` : ""}${cards}</section>`);
}
const all = () => document.querySelectorAll("details.animal");
document.getElementById("openAll").onclick = () => all().forEach(d => d.open = true);
document.getElementById("closeAll").onclick = () => all().forEach(d => d.open = false);
const root = document.documentElement;
try { const t = localStorage.getItem("hczoo-theme"); if (t) root.dataset.theme = t; } catch (e) {}
document.getElementById("theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("hczoo-theme", root.dataset.theme); } catch (e) {}
};
</script>
</body>
</html>
