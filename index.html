<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scouting 童軍教學資源</title>
<link rel="icon" href="img/favicon.png">
<meta name="description" content="童軍活動與戶外教學用的教學資源。">
<style>
:root{
  --bg:#f3f0e6; --card:#fffdf7; --ink:#26221c; --muted:#6a6358; --line:#ddd6c4;
  --gold:#e0a91b; --purple:#6a3d8f; --accent:#6a3d8f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191714; --card:#24211c; --ink:#ece6da; --muted:#b0a796; --line:#3a352c;
    --gold:#f0c24a; --purple:#b892dd; --accent:#c9a6ec;
  }
}
:root[data-theme="dark"]{
  --bg:#191714; --card:#24211c; --ink:#ece6da; --muted:#b0a796; --line:#3a352c;
  --gold:#f0c24a; --purple:#b892dd; --accent:#c9a6ec;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  line-height:1.7;font-size:17px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.bar{display:flex;justify-content:flex-end;padding:14px 0 0}
#theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:6px 12px;font-size:.9rem;cursor:pointer}
.hero{text-align:center;padding:6px 0 10px}
.hero img{height:1.2cm;width:auto;display:block;margin:0 auto}
h1{font-size:2rem;margin:10px 0 2px;line-height:1.3;letter-spacing:.08em}
.sub{color:var(--muted);margin:0}
.scarf{height:6px;width:120px;margin:14px auto 0;border-radius:3px;
  background:linear-gradient(90deg,var(--gold) 0 50%,var(--purple) 50% 100%)}
main{padding:20px 0 10px}
.cards{display:grid;gap:14px;max-width:460px;margin:0 auto}
.card{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-top:5px solid var(--gold);border-radius:14px;padding:16px;color:var(--ink);text-decoration:none;
  transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.card .ic{font-size:2.1rem;line-height:1;flex:none}
.card b{display:block;font-size:1.15rem}
.card span{color:var(--muted);font-size:.92rem;line-height:1.55;display:block;margin-top:2px}
.card .go{color:var(--accent);font-size:.88rem;margin-top:8px}
footer.wrap{color:var(--muted);font-size:.85rem;padding-top:36px;padding-bottom:40px;text-align:center}
@media (max-width:480px){ body{font-size:16px} h1{font-size:1.6rem} }
</style>
</head>
<body>
<div class="wrap bar"><button id="theme" type="button" aria-label="切換深色或淺色">🌓 深淺色</button></div>
<header class="wrap hero">
  <img src="img/penguin-scarf.png" alt="戴著童軍領巾、拿著六分儀和地圖的跳岩企鵝" width="448" height="589">
  <h1>Scouting</h1>
  <p class="sub">童軍教學資源</p>
  <div class="scarf" aria-hidden="true"></div>
</header>
<main class="wrap">
  <div class="cards">
    <a class="card" href="hsinchuzoo/">
      <div class="ic" aria-hidden="true">🦒</div>
      <div><b>新竹動物園 動物小百科</b>
        <span>依展區介紹每一種動物：我是誰、我家在哪裡、生態與經濟功能、獨特超能力和特殊需求。</span>
        <div class="go">進入 →</div></div>
    </a>
  </div>
</main>
<footer class="wrap">Be Prepared</footer>
<script>
const root = document.documentElement;
try { const t = localStorage.getItem("scouting-theme"); if (t) root.dataset.theme = t; } catch (e) {}
document.getElementById("theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("scouting-theme", root.dataset.theme); } catch (e) {}
};
</script>
</body>
</html>
